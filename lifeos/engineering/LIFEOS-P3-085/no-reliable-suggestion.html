<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeOS｜今日｜暂无可靠建议</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <p class="eyebrow">LifeOS · 纯本地演示页面</p>
      <h1>今日</h1>
      <p class="boundary">此页不读取资料，不生成建议。AI 未启用，网络未使用。</p>
      <nav class="page-nav" aria-label="今日状态导航">
        <a href="default-recovery.html">默认恢复</a>
        <a class="current" aria-current="page" href="no-reliable-suggestion.html">暂无可靠建议</a>
        <a href="restricted-offline.html">权限受限 · 离线</a>
      </nav>
    </header>

    <section aria-labelledby="empty-project-title">
      <p class="label">Project 状态</p>
      <h2 id="empty-project-title">尚未选择 Project</h2>
      <article class="hero empty">
        <h3>暂无可靠建议</h3>
        <p>缺口：尚未确定当前 Project，也没有足够的当前停点证据。</p>
        <p>不会据最近痕迹生成恢复或建议。</p>
      </article>
    </section>

    <section class="card" aria-labelledby="path-title">
      <h3 id="path-title">继续路径</h3>
      <p>先由你选择下一步；本页不会虚构重点或建议。</p>
      <div class="actions">
        <button type="button" id="choose-project">选择 Project</button>
        <button type="button" class="secondary" id="record-stop">先记录当前停点</button>
      </div>
      <p id="no-suggestion-status" role="status" aria-live="polite">请选择一条路径。</p>
    </section>

    <section class="card ai-closed" aria-labelledby="empty-ai-title">
      <h3 id="empty-ai-title">AI</h3>
      <p><strong>AI 未启用：</strong>没有建议可供确认。</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
