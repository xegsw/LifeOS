[package]
name = "lifeos-p3-146"
version = "0.1.0"
description = "LifeOS P3-145 minimal Work and non-medical Health context candidate"
authors = ["LifeOS"]
edition = "2021"
rust-version = "1.98"

[build-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
sha2 = "=0.10.9"
aes-gcm = "=0.10.3"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rand = "=0.8.6"
security-framework = "=3.5.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
zeroize = "=1.8.1"

[dev-dependencies]
sha2 = "=0.10.9"
tauri-build = { version = "=2.6.3", features = [] }

[profile.dev]
debug = 1
