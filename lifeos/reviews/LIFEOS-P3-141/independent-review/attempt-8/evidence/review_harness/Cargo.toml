[package]
name = "lifeos-p3-141-attempt-8-review-harness"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAccessibility", "NSAccessibilityConstants"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKWebView"] }
