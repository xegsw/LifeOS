[package]
name = "lifeos-p3-143"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
build = "build.rs"

[dependencies]
aes-gcm = "=0.10.3"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rand = "=0.8.6"
security-framework = "=3.5.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }
zeroize = "=1.8.1"

[build-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri-build = { version = "=2.6.3", features = [] }

[dev-dependencies]
sha2 = "=0.10.9"
tauri-build = { version = "=2.6.3", features = [] }
