<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P119 synthetic GUI fixture</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #f5f7fa; }
    main { width: 100%; height: 100%; display: grid; place-items: center; }
    #stage {
      width: min(1040px, calc(100vw - 80px)); height: min(700px, calc(100vh - 120px)); border: 0; border-radius: 24px; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; box-shadow: 0 24px 64px rgb(0 0 0 / 18%); outline: none;
    }
    #marker { font-size: 44px; font-weight: 750; letter-spacing: .04em; }
    #keyAdvance { border: 2px solid rgb(255 255 255 / 70%); border-radius: 12px; background: rgb(255 255 255 / 16%); color: #fff; font: inherit; font-weight: 700; padding: 12px 20px; }
    #keyAdvance:focus-visible { outline: 4px solid #fff; outline-offset: 5px; }
    .s0 { background: #D94F4F; }
    .s1 { background: #3FAE6A; }
    .s2 { background: #3478F6; }
    .s3 { background: #8E5BD9; }
  </style>
</head>
<body>
  <main>
    <section id="stage" class="s0" tabindex="0" aria-label="Synthetic state transition surface">
      <output id="marker">P119-S0</output>
      <button id="keyAdvance" type="button">Keyboard transition</button>
    </section>
  </main>
  <script>
    (() => {
      const stage = document.querySelector('#stage');
      const marker = document.querySelector('#marker');
      const keyAdvance = document.querySelector('#keyAdvance');
      const colors = ['s0', 's1', 's2', 's3'];
      let state = 0;

      function render(next) {
        state = next;
        stage.classList.remove(...colors);
        stage.classList.add(colors[state]);
        marker.value = `P119-S${state}`;
        marker.textContent = `P119-S${state}`;
      }

      stage.addEventListener('click', (event) => {
        if (event.target === keyAdvance) return;
        if (state < 2) render(state + 1);
      });
      keyAdvance.addEventListener('click', () => {
        if (state === 2) render(3);
      });
    })();
  </script>
</body>
</html>
