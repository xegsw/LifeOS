name: LifeOS CI and Synthetic Delivery

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/l0-*'
      - 'codex/l1-*'
      - 'codex/l2-*'
  workflow_dispatch:
    inputs:
      package_synthetic_candidate:
        description: Package the current synthetic candidate after all gates pass
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lifeos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/lifeos-ci.yml
            AGENTS.md
            lifeos/ACCEPTANCE_GOVERNANCE.md
            lifeos/PM_OPERATING_MODEL.md
            lifeos/DECISION_LOG.md
            lifeos/ci
            lifeos/tools/lifeos_ci.py
            lifeos/templates
            lifeos/tasks
            lifeos/product/LIFEOS_MODEL_SETTINGS_BASELINE_V1.md
            lifeos/architecture/LifeOS架构基线V1.0.md
            lifeos/architecture/LifeOS高保真原型IA-V1.0.md
            lifeos/engineering/LIFEOS-P3-141/revision-3-model-settings/candidate
            lifeos/engineering/LIFEOS-P3-142/candidate
            lifeos/engineering/LIFEOS-P3-144/candidate
      - name: Validate governance, frozen baselines, and resume schema
        run: python3 lifeos/tools/lifeos_ci.py validate
      - name: Reject whitespace and conflict markers
        run: git diff --check

  deterministic-regression:
    runs-on: macos-latest
    needs: governance-guard
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitignore
            lifeos/ci
            lifeos/tools/lifeos_ci.py
            lifeos/engineering/LIFEOS-P3-141/revision-3-model-settings/candidate
            lifeos/engineering/LIFEOS-P3-142/candidate
            lifeos/engineering/LIFEOS-P3-144/candidate
      - name: Install rustfmt for the active pinned toolchain
        run: rustup component add --toolchain 1.98.0-aarch64-apple-darwin rustfmt
      - name: Show deterministic toolchain
        run: |
          python3 --version
          node --version
          cargo --version
      - name: Run registered synthetic-only checks
        # Dependency preparation is separate from the registered offline test command.
        # Credential tests remain a manual gate; p3_144_ci.py verifies the complete inventory.
        run: |
          cargo fetch --locked --manifest-path lifeos/engineering/LIFEOS-P3-144/candidate/Cargo.toml
          python3 lifeos/tools/lifeos_ci.py run-checks

  p3-146-regression:
    name: P3-146 offline conversation and memory regression
    runs-on: macos-14
    needs: governance-guard
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /private/tmp/lifeos-p3-146-conversation-source-v1/initial-build-cache
      LIFEOS_P3_146_PROFILE: synthetic
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: lifeos/engineering/LIFEOS-P3-146/candidate
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lifeos/engineering/LIFEOS-P3-146
            lifeos/deliverables/LIFEOS-P3-146_natural_conversation_memory_and_source_integration.md
            lifeos/ci
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create exclusive synthetic root
        run: python3 "$GITHUB_WORKSPACE/lifeos/ci/p3_146_ci.py" init
      - name: Install build toolchain and fetch locked dependencies only
        env:
          TMPDIR: /private/tmp/lifeos-p3-146-conversation-source-v1/tmp
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fetch --locked
      - name: Run without network or production credentials
        run: python3 "$GITHUB_WORKSPACE/lifeos/ci/p3_146_ci.py" run
      - name: Clean only this job synthetic root
        if: always()
        run: python3 "$GITHUB_WORKSPACE/lifeos/ci/p3_146_ci.py" cleanup

  promote-low-risk:
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref_name, 'codex/l0-') ||
       startsWith(github.ref_name, 'codex/l1-') ||
       startsWith(github.ref_name, 'codex/l2-'))
    runs-on: ubuntu-latest
    needs: [governance-guard, deterministic-regression, p3-146-regression]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/lifeos-ci.yml
      - name: Verify fast-forward-only promotion boundary
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          ! git diff --name-only origin/main...HEAD | grep -E '(^|/)(Pilot|pilot|real-use|credentials?|secrets?)(/|$)|\.sqlite($|[-.])|\.env($|\.)|\.key$'
      - name: Fast-forward main after all gates pass
        run: git push origin HEAD:main

  synthetic-candidate-package:
    if: github.event_name == 'workflow_dispatch' && inputs.package_synthetic_candidate
    runs-on: ubuntu-latest
    needs: [governance-guard, deterministic-regression]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            lifeos/engineering/LIFEOS-P3-141/revision-3-model-settings/candidate
      - name: Package source-only synthetic candidate
        run: |
          mkdir -p dist
          tar \
            --exclude='target' \
            --exclude='evidence' \
            --exclude='*.sqlite*' \
            --exclude='*.key' \
            -czf dist/lifeos-p3-141-synthetic-source-${GITHUB_SHA}.tar.gz \
            lifeos/engineering/LIFEOS-P3-141/revision-3-model-settings/candidate
          shasum -a 256 dist/*.tar.gz > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lifeos-synthetic-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
